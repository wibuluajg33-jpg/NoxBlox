<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NoxStudio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>[hidden]{display:none!important}html,body{margin:0;height:100%;background:#0f1218;color-scheme:dark}#app{position:fixed;inset:0}
.sx-host{position:relative;width:100%;height:100%;background:#14171f;color:#e4e8f1;font:13px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
.sx{--bg:#14171f;--p:#1b1f2a;--p2:#232938;--ln:#2e3547;--tx:#e4e8f1;--mu:#8e98ad;--bl:#2f7bff;--gr:#22c26e;--rd:#ff5a5f;
 position:absolute;inset:0;display:grid;grid-template-rows:auto auto 1fr auto auto;background:var(--bg);color:var(--tx)}
.sx *{box-sizing:border-box}
.sx button,.sx input,.sx select,.sx textarea{font:inherit;color:inherit}
.sx button{cursor:pointer}.sx button:disabled{opacity:.4;cursor:default}
.sx :focus-visible{outline:2px solid var(--bl);outline-offset:-2px}
.sx-sp{flex:1}
.sx-bar{display:flex;align-items:center;gap:8px;padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));background:#0f1218;border-bottom:1px solid var(--ln);min-width:0}
.sx-logo{font:700 16px/1 "Chakra Petch",Inter,sans-serif;letter-spacing:.02em;white-space:nowrap}.sx-logo i{font-style:normal;color:var(--bl)}
.sx-pname{background:transparent;border:1px solid transparent;border-radius:6px;padding:3px 8px;color:var(--mu);max-width:22vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sx-pname:hover{border-color:var(--ln);color:var(--tx)}
.sx-tabs{display:flex;gap:2px;overflow-x:auto;min-width:0;scrollbar-width:none}.sx-tabs::-webkit-scrollbar{display:none}
.sx-tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:6px 10px;color:var(--mu);white-space:nowrap}
.sx-tabs button[aria-selected=true]{color:var(--tx);border-bottom-color:var(--bl)}
.sx-go{display:flex;align-items:center;gap:6px;height:30px;padding:0 14px;border:0;border-radius:6px;background:var(--gr);color:#04170d;font-weight:700}
.sx-pub{height:30px;padding:0 14px;border:0;border-radius:6px;background:var(--bl);color:#fff;font-weight:700;white-space:nowrap}
.sx-ribbon{display:flex;gap:0;overflow-x:auto;background:var(--p);border-bottom:1px solid var(--ln);min-height:70px;padding:0 max(4px,env(safe-area-inset-left,0px))}
.sx-g{display:flex;flex-direction:column;border-right:1px solid var(--ln);padding:4px 8px 2px;flex:none}
.sx-gi{display:flex;gap:2px;align-items:center;flex:1}
.sx-gn{font-size:10px;color:var(--mu);text-align:center;letter-spacing:.04em;text-transform:uppercase}
.sx-b{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:48px;padding:4px 6px;background:transparent;border:1px solid transparent;border-radius:6px;font-size:11px;white-space:nowrap}
.sx-b:hover:not(:disabled){background:var(--p2);border-color:var(--ln)}.sx-b.on{background:#25417a;border-color:var(--bl)}.sx-b.go{color:var(--gr)}
.sx-q{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu);margin:0 6px;white-space:nowrap}
.sx-q input[type=color]{width:30px;height:24px;padding:0;border:1px solid var(--ln);background:none}
.sx-q select,.sx-q input[type=number]{background:var(--bg);border:1px solid var(--ln);border-radius:5px;padding:3px 5px}
.sx-main{display:grid;grid-template-columns:190px minmax(0,1fr) 270px;min-height:0;min-width:0}
.sx-main.no-tb{grid-template-columns:minmax(0,1fr) 270px}.sx-main.no-right{grid-template-columns:190px minmax(0,1fr)}.sx-main.no-tb.no-right{grid-template-columns:minmax(0,1fr)}
.sx-main.no-tb .sx-toolbox,.sx-main.no-right .sx-right,.sx-main.no-ex .sx-explorer,.sx-main.no-pr .sx-props,.sx-main.no-out .sx-output{display:none}
.sx-p{background:var(--p);display:flex;flex-direction:column;min-height:0;min-width:0;border:1px solid var(--ln)}
.sx-ph{display:flex;align-items:center;margin:0;padding:5px 10px;font:600 12px/1.2 Inter,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);background:#171b25;border-bottom:1px solid var(--ln)}
.sx-pb{overflow:auto;flex:1;min-height:0}
.sx-toolbox .sx-pb{padding:6px}.sx-toolbox h4{margin:8px 4px 6px;font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.sx-tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.sx-tile{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;background:var(--p2);border:1px solid var(--ln);border-radius:8px;text-align:center;font-size:12px}
.sx-tile:hover{border-color:var(--bl)}.sx-tile small{color:var(--mu);font-size:10px;line-height:1.2}
.sx-center{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.sx-doctabs{display:flex;background:#0f1218;border-bottom:1px solid var(--ln);overflow-x:auto;scrollbar-width:none;min-height:30px}
.sx-dt{display:flex;align-items:center;background:transparent;border:0;border-right:1px solid var(--ln);color:var(--mu);white-space:nowrap}
button.sx-dt{padding:6px 12px}.sx-dt.on{background:var(--p);color:var(--tx)}
.sx-dt>button{background:transparent;border:0;padding:6px 8px;display:flex;align-items:center;gap:4px}.sx-dt>button.sx-x{padding:6px 8px;color:var(--mu)}
.sx-view{position:relative;flex:1;min-height:120px;background:#7ec0ff}
.sx-view canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.sx-hint{position:absolute;left:8px;bottom:6px;background:rgba(10,12,17,.65);padding:2px 8px;border-radius:5px;font-size:11px;pointer-events:none;color:#cfd6e6}
.sx-code{display:flex;flex-direction:column;flex:1;min-height:0;background:#10131a}
.sx-codebar{display:flex;align-items:center;gap:8px;padding:4px 8px;border-bottom:1px solid var(--ln);color:var(--mu);font-size:12px}
.sx-ed{display:flex;flex:1;min-height:0;position:relative;overflow:hidden;font:13px/20px ui-monospace,Menlo,Consolas,monospace}
.sx-gut{flex:none;width:44px;padding:8px 8px 0 0;text-align:right;color:#566078;background:#0d1016;white-space:pre;overflow:hidden;border-right:1px solid var(--ln)}
.sx-edin{position:relative;flex:1;min-width:0;overflow:hidden}
.sx-hl,#sx-ta{position:absolute;inset:0;margin:0;padding:8px 10px;font:inherit;line-height:20px;white-space:pre;tab-size:2;border:0;letter-spacing:0}
.sx-hl{color:#d7dcea;pointer-events:none;overflow:visible;width:max-content;min-width:100%;height:max-content}
#sx-ta{background:transparent;color:transparent;caret-color:#fff;resize:none;outline:none;overflow:auto;width:100%;height:100%;-webkit-text-fill-color:transparent}
#sx-ta::selection{background:rgba(47,123,255,.4);-webkit-text-fill-color:transparent}
.sx-hl .c{color:#6b7791;font-style:italic}.sx-hl .s{color:#a5e075}.sx-hl .n{color:#f2a65a}.sx-hl .k{color:#c792ea}.sx-hl .a{color:#5ac8fa}
.sx-codest{display:flex;gap:16px;padding:3px 10px;border-top:1px solid var(--ln);font-size:11px;color:var(--mu)}.sx-codest .ok{color:var(--gr)}.sx-codest .bad{color:var(--rd)}
.sx-playhost{position:relative;flex:1;min-height:200px;background:#000}
.sx-output{height:150px;flex:none}
.sx-log{overflow:auto;flex:1;padding:4px 8px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;user-select:text}
.sx-l{display:flex;gap:8px;white-space:pre-wrap;word-break:break-word}.sx-l time{color:#566078;flex:none}
.sx-l.warn{color:#ffd166}.sx-l.error{color:#ff6b6b}.sx-l.cmd{color:#5ac8fa}.sx-l.info{color:#e4e8f1}
.sx-right{display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr);min-height:0;min-width:0}
.sx-main.no-ex .sx-right,.sx-main.no-pr .sx-right{grid-template-rows:minmax(0,1fr)}
.sx-row{display:flex;align-items:center;gap:4px;padding:2px 6px 2px calc(6px + var(--d)*14px);min-height:26px;cursor:default;white-space:nowrap}
.sx-row:hover{background:#222839}.sx-row.sel{background:#25417a}.sx-row.drop{outline:1px dashed var(--bl)}
.sx-car{width:16px;height:20px;background:transparent;border:0;color:var(--mu);padding:0;font-size:11px}
.sx-nm{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.sx-plus{width:20px;height:20px;border-radius:5px;border:1px solid var(--ln);background:var(--p2);padding:0;line-height:1;color:var(--mu)}
.sx-ren{flex:1;min-width:0;background:var(--bg);border:1px solid var(--bl);border-radius:4px;padding:1px 4px}
.sx-ico{flex:none}
.sx-empty{margin:0;padding:14px;color:var(--mu)}
.sx-ptitle{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--ln)}.sx-ptitle small{color:var(--mu);margin-left:auto}
.sx-psec{padding:4px 10px;background:#171b25;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.sx-prow{display:flex;align-items:center;gap:8px;padding:3px 10px;min-height:28px}.sx-prow>label{width:104px;flex:none;color:var(--mu);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.sx-prow>div{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.sx-prow input[type=text],.sx-prow input[type=number],.sx-prow select{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:5px;padding:3px 6px;min-width:0}
.sx-prow input[type=color]{width:34px;height:24px;padding:0;border:1px solid var(--ln);background:none}
.sx-vec{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:100%}.sx-vec input{padding:3px 4px!important}
.sx-ro{color:var(--tx);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.sx-cmd{display:flex;align-items:center;gap:8px;padding:4px 10px;background:#0f1218;border-top:1px solid var(--ln)}
.sx-cmd[hidden]{display:none}.sx-cmd label{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.sx-cmd input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--ln);border-radius:5px;padding:5px 8px;font-family:ui-monospace,Menlo,Consolas,monospace}.sx-prompt{color:var(--bl);font-family:monospace}
.sx-status{padding:2px 10px;padding-bottom:max(2px,env(safe-area-inset-bottom,0px));background:var(--bl);color:#fff;font-size:11px;min-height:20px}
.sx-mtabs{display:none}
.sx-sm{height:30px;padding:0 12px;border-radius:6px;border:1px solid var(--ln);background:var(--p2)}.sx-sm.blue{background:var(--bl);border-color:var(--bl);color:#fff}.sx-sm.go{background:var(--gr);border-color:var(--gr);color:#04170d;font-weight:700}.sx-sm.danger{color:var(--rd)}
.sx-menu{position:absolute;z-index:20;background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:4px;display:flex;flex-direction:column;min-width:160px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.sx-menu button{display:flex;align-items:center;gap:8px;padding:6px 10px;background:transparent;border:0;border-radius:5px;text-align:left}.sx-menu button:hover{background:#2c3550}
.sx-modal{position:absolute;inset:0;z-index:30;background:rgba(5,7,12,.7);display:flex;align-items:center;justify-content:center;padding:12px}.sx-modal[hidden]{display:none}
.sx-dlg{width:100%;max-width:460px;max-height:100%;overflow:auto;background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}.sx-dlg.wide{max-width:760px}
.sx-dlg h2{margin:0;font:700 18px "Chakra Petch",Inter,sans-serif}.sx-dbody{display:flex;flex-direction:column;gap:10px;min-height:0}
.sx-note{margin:0;color:var(--mu);font-size:12px}.sx-err{margin:0;color:var(--rd);font-size:12px;min-height:16px}
.sx-pubf{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sx-pubf label{display:flex;flex-direction:column;gap:3px;color:var(--mu);font-size:12px}
.sx-pubf input{background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:6px 8px;color:var(--tx)}
.sx-ptabs{display:flex;gap:4px;flex-wrap:wrap}.sx-ptabs button{padding:5px 12px;border-radius:6px;border:1px solid var(--ln);background:var(--p2)}.sx-ptabs button[aria-selected=true]{background:var(--bl);border-color:var(--bl);color:#fff}
.sx-pcode{width:100%;height:min(46vh,340px);background:#0d1016;border:1px solid var(--ln);border-radius:8px;padding:10px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#d7dcea;resize:vertical;white-space:pre;overflow:auto}
.sx-mbtn{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sx-stat{color:var(--mu);font-size:12px}
.sx-tpl{display:grid;gap:8px}.sx-tplb,.sx-pop{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:8px;border:1px solid var(--ln);background:var(--p2);text-align:left;width:100%}.sx-tplb:hover,.sx-pop:hover{border-color:var(--bl)}
.sx-tplb span,.sx-pop span{color:var(--mu);font-size:12px}
.sx-plist{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}.sx-pitem{display:flex;gap:6px;align-items:stretch}.sx-pitem.cur .sx-pop{border-color:var(--bl)}.sx-pitem .sx-sm{height:auto}
.sx-api{display:flex;flex-direction:column;gap:6px;max-height:55vh;overflow:auto}.sx-api div{display:flex;flex-direction:column;padding:6px 8px;background:var(--p2);border-radius:6px}.sx-api code{color:#5ac8fa;font-size:12px}.sx-api span{color:var(--mu);font-size:12px}
.sx-host.sx-playing .sx-ribbon .sx-b:not([data-c=stop]):not([data-c=respawn]):not([data-c=clearout]){opacity:.45}
@media (max-width:820px){
  .sx{grid-template-rows:auto auto 1fr auto auto auto}
  .sx-main,.sx-main.no-tb,.sx-main.no-right,.sx-main.no-tb.no-right{display:block;position:relative}
  .sx-main>*{position:absolute;inset:0;display:none!important}
  .sx-main[data-m=view] .sx-center{display:flex!important}
  .sx-main[data-m=view] .sx-output{display:none!important}
  .sx-main[data-m=output] .sx-center{display:flex!important}.sx-main[data-m=output] .sx-center>:not(.sx-output){display:none!important}.sx-main[data-m=output] .sx-output{display:flex!important;height:auto;flex:1}
  .sx-main[data-m=toolbox] .sx-toolbox{display:flex!important}
  .sx-main[data-m=explorer] .sx-right,.sx-main[data-m=props] .sx-right{display:grid!important;grid-template-rows:1fr}
  .sx-main[data-m=explorer] .sx-props,.sx-main[data-m=props] .sx-explorer{display:none!important}
  .sx-mtabs{display:flex;background:#0f1218;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
  .sx-mtabs button{flex:1;padding:9px 2px;background:transparent;border:0;color:var(--mu);font-size:12px;border-top:2px solid transparent}.sx-mtabs button[aria-selected=true]{color:var(--tx);border-top-color:var(--bl)}
  .sx-bar{flex-wrap:wrap;row-gap:0}.sx-tabs{order:5;flex:1 0 100%}.sx-logo{flex:1}
  .sx-pname{display:none}.sx-pubf{grid-template-columns:1fr}.sx-cmd label{display:none}
  .sx-ribbon{min-height:64px}
  .sx-status{display:none}
}
.sx-go.stop{background:var(--rd);color:#fff}
.sx-dpad{position:absolute;right:12px;bottom:12px;display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px) auto;gap:4px;z-index:2;touch-action:none;user-select:none;-webkit-user-select:none}
.sx-dpad button{border-radius:10px;border:1px solid rgba(255,255,255,.3);background:rgba(10,12,17,.62);color:#fff;font-size:17px;padding:0;touch-action:none;-webkit-tap-highlight-color:transparent}
.sx-dpad button.on{background:var(--bl,#2f7bff);border-color:var(--bl,#2f7bff)}
.sx-dpad .u{grid-column:2;grid-row:1}.sx-dpad .l{grid-column:1;grid-row:2}.sx-dpad .d{grid-column:2;grid-row:2}.sx-dpad .r{grid-column:3;grid-row:2}
.sx-dpad .z1,.sx-dpad .z2{grid-row:3;font-size:12px;font-weight:600}.sx-dpad .z1{grid-column:1/3}.sx-dpad .z2{grid-column:3}
.sx-hint{right:auto}
</style>

<body>
<div id="app"></div>
<script>
/* NoxLib: model data, serialisasi HTML, API skrip, dan runtime game.
   Satu fungsi mandiri. Kode yang sama dipakai NoxStudio (Play) dan file HTML hasil Publikasikan. */
function NoxLibFactory(){
  var D2R=Math.PI/180,uidN=0;
  function uid(){uidN++;return 'n'+uidN.toString(36)+Math.random().toString(36).slice(2,6)}
  function clone(o){return JSON.parse(JSON.stringify(o))}
  function num(v,d){v=parseFloat(v);return isFinite(v)?v:d}
  function fmt(n){return String(+(+n).toFixed(3))}
  function arrStr(a){return a.map(fmt).join(' ')}
  function strArr(s,d){
    var a=String(s==null?'':s).trim().split(/[\s,]+/).map(parseFloat);
    return (a.length===3&&a.every(isFinite))?a:d.slice();
  }
  function escAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  var CLOSE='</scr'+'ipt';

  /* ---------- model data ---------- */
  var MATERIALS=['Plastic','Neon','Glass','Metal'];
  var SHAPES=['Block','Sphere','Cylinder'];
  var PART_DEF={shape:'Block',pos:[0,0.5,0],size:[4,1,2],rot:[0,0,0],color:'#a3a2a5',material:'Plastic',transp:0,anchored:true,collide:true};
  function isPart(n){return !!n&&(n.cls==='Part'||n.cls==='SpawnLocation')}
  function mk(cls,name,p,kids,src){
    var n={id:uid(),cls:cls,name:name||cls,p:p||{},kids:kids||[]};
    if(cls==='Script')n.src=src||'';
    return n;
  }
  function part(name,o){
    var p=clone(PART_DEF),k;
    for(k in (o||{}))p[k]=clone(o[k]);
    return mk('Part',name||'Part',p);
  }
  function spawn(name,o){
    var p=clone(PART_DEF),k;
    p.size=[6,1,6];p.color='#2f7bff';p.pos=[0,0.5,0];
    for(k in (o||{}))p[k]=clone(o[k]);
    return mk('SpawnLocation',name||'SpawnLocation',p);
  }
  function script(name,src,enabled){var n=mk('Script',name||'Script',{enabled:enabled!==false},[],src);return n}
  function model(name,kids){return mk('Model',name||'Model',{},kids||[])}
  function folder(name,kids){return mk('Folder',name||'Folder',{},kids||[])}
  function defaultTree(kind){
    var ws=mk('Workspace','Workspace',{gravity:196.2,voidY:-100},[]);
    ws.kids.push(part('Baseplate',{pos:[0,-1,0],size:[512,2,512],color:'#5d6068'}));
    ws.kids.push(spawn('SpawnLocation',{pos:[0,0.5,0]}));
    if(kind==='obby'){
      var cols=['#ff6b6b','#ffb84d','#7bdc6e','#4dc3ff','#b085ff'];
      for(var i=0;i<6;i++)ws.kids.push(part('Platform'+(i+1),{pos:[0,2+i*1.5,12+i*9],size:[8,1,6],color:cols[i%5]}));
      var lava=part('Lava',{pos:[0,0.3,36],size:[40,0.6,50],color:'#ff4d1a',material:'Neon'});
      lava.kids.push(script('KillScript','script.Parent.Touched.connect(function(other){\n  if(other.IsPlayer){ other.Kill(); }\n});\n'));
      ws.kids.push(lava);
    }
    var li=mk('Lighting','Lighting',{brightness:1,ambient:'#8a93a8',clock:14,fogEnd:1500,shadows:true},[]);
    var sp=mk('StarterPlayer','StarterPlayer',{walkSpeed:16,jumpPower:50},[]);
    var ss=mk('ServerScriptService','ServerScriptService',{},[]);
    if(kind==='obby')ss.kids.push(script('Main','print("Selamat datang di game obby!");\nmessage("Naiki semua platform tanpa jatuh ke lava!", 5);\n'));
    else ss.kids.push(script('Main','print("Halo dari NoxStudio!");\n'));
    return {id:uid(),cls:'DataModel',name:'game',p:{},kids:[ws,li,sp,ss]};
  }
  function walk(n,f,parent){f(n,parent);for(var i=0;i<n.kids.length;i++)walk(n.kids[i],f,n)}
  function find(root,id){var r=null;walk(root,function(n){if(n.id===id)r=n});return r}
  function parentOf(root,node){var r=null;walk(root,function(n,p){if(n===node)r=p||null});return r}
  function service(root,cls){for(var i=0;i<root.kids.length;i++)if(root.kids[i].cls===cls)return root.kids[i];return null}
  function cloneNode(n){
    var c={id:uid(),cls:n.cls,name:n.name,p:clone(n.p),kids:n.kids.map(cloneNode)};
    if(n.cls==='Script')c.src=n.src||'';
    return c;
  }
  function ensureServices(root){

      camera.position.set(p.x+Math.sin(yaw)*cp*dist,p.y+fy+Math.sin(pitch)*dist,p.z+Math.cos(yaw)*cp*dist);

    }
    /* mulai */
    root.kids.forEach(function(s){walk(s,function(){})});
    addNode(WS);
    respawn();

    var scripts=[];walk(root,function(n){if(n.cls==='Script')scripts.push(n)});
    scripts.forEach(function(n){if(inWorkspace(n)||under(n,service(root,'ServerScriptService')))runScript(n)});

    return {

  ex.addEventListener('dragover',function(e){var r=e.target.closest('.sx-row');if(!r||!dragId)return;var np=L.find(tree,r.dataset.id),n=L.find(tree,dragId);if(n&&np&&canContain(np,n)&&np!==n&&!L.find(n,np.id)){e.preventDefault();$$('.sx-row.drop',ex).forEach(function(x){x.classList.remove('drop')});r.classList.add('drop')}});
  ex.addEventListener('dragleave',function(e){var r=e.target.closest('.sx-row');if(r)r.classList.remove('drop')});
  ex.addEventListener('drop',function(e){var r=e.target.closest('.sx-row');if(!r||!dragId)return;e.preventDefault();moveNode(dragId,r.dataset.id);dragId=null});
  ex.addEventListener('dragend',function(){dragId=null;$$('.sx-row.drop',ex).forEach(function(x){x.classList.remove('drop')})});
  function applyPanels(){
    var m=$('#sx-main');
    m.classList.toggle('no-tb',!panels.toolbox);m.classList.toggle('no-ex',!panels.explorer);m.classList.toggle('no-pr',!panels.props);m.classList.toggle('no-out',!panels.output);
    m.classList.toggle('no-right',!panels.explorer&&!panels.props);
    $('#sx-cmd').hidden=!panels.cmd;if(grid)grid.visible=!!panels.grid;
    setTimeout(resize,0);dirty=true;
  }
  function initView(){
    tabsHTML();ribbonHTML();toolboxHTML();fullRefresh();renderDocTabs();showTab();applyPanels();
    meshes.forEach(function(m){scene.remove(m)});meshes.clear();syncMeshes();
    cam={t:[0,4,0],yaw:0.7,pitch:0.5,dist:36,fov:60};dirty=true;resize();
    setStatus('Proyek: '+meta.name);
  }
  /* mulai */
  var last=data.last&&data.projects[data.last];
  if(!last){var ks=Object.keys(data.projects);last=ks.length?data.projects[ks[0]]:newProject('base','Game Pertamaku')}
  openProject(last);
  initGL();initView();
  out('info','NoxStudio siap. Klik objek di viewport, ubah propertinya, lalu tekan Play.');
  frame();
  var api={
    state:function(){return {tree:tree,sel:sel,mode:mode,cam:cam,W:W,H:H,play:!!play}},
    project:function(){return proj},project2:function(){return meta},
    project3:null,
    rayAt:rayAt,project4:null,toScreen:project,pick:pickPart,
    gizmoHit:hitGizmo,
    destroy:function(){
      cancelAnimationFrame(raf);clearTimeout(saveT);clearTimeout(codeT);persist();stopPlay();AB.abort();if(ro)ro.disconnect();
      try{renderer&&renderer.dispose();renderer&&renderer.forceContextLoss()}catch(e){}
      host.classList.remove('sx-host');host.innerHTML='';
    },
    exportFull:exportFull,exportStructure:exportStructure
  };
  host.dispatchEvent(new CustomEvent('nox-studio-ready',{detail:api}));
  return api;
}

(function(){
var KEY='noxstudio.v1';
var store={get:function(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}},set:function(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}};
var mem=null;
if(!store.get()){try{localStorage.setItem(KEY,'{}')}catch(e){mem={};store={get:function(){return mem},set:function(d){mem=d}}}}
NoxStudioMount(document.getElementById('app'),{Lib:NoxLibFactory(),store:store,libSource:NoxLibFactory.toString()});
})();
</script>
